<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Peninah</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>

    <header class="header">
        <a href="index.html" class="logo"><span>Peni</span>nah</a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="projects.html" class="active">Projects</a>
            <a href="education.html">Education & Certs</a>
            <a href="experience.html">Experience</a>
        </nav>

        <a href="contact.html" class="active">Contact Me</a>
    </header>

    <section class="contact-form">
        <h2 class="contact-me">Contact <span>Me</span></h2>

        <form id="contact-form">

            <div class="input-box">
                <input type="text" name="from_name" placeholder="Full Name" required>
                <input type="email" name="from_email" placeholder="Email" required>
                <input type="text" name="subject" placeholder="Subject (e.g. Job Opportunity)">
            </div>

            <textarea name="message" cols="30" rows="8" placeholder="Your Message"></textarea>

            <input type="submit" value="Send Message" class="btn-1">
        </form>
    </section>

    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script>
        (function () {
            emailjs.init("1eVTNN9mafWsrzRWY");
        })();
    </script>

    <script>
        document.getElementById("contact-form").addEventListener("submit", function (e) {
            e.preventDefault();

            emailjs.sendForm(
                "service_jofmqsp",
                "template_hhcljju",
                this
            ).then(
                () => {
                    alert("Message sent successfully!");
                    this.reset(); // clears the form
                },
                () => {
                    alert("Failed to send message. Try again.");
                }
            );
        });
    </script>

    <footer class="footer">
        <div class="social">
            <a href="https://www.linkedin.com/in/elizabeth-p-a-onyango/"><i class='bx bxl-linkedin-square'></i></a>
            <a href="https://github.com/ninahonyango"><i class='bx bxl-github'></i></a>
            <a href="mailto:peninahelizabeth98@gmail.com" target="_blank">
                <i class='bx bxl-gmail'></i>
            </a>
        </div>

        <p class="copyright">&copy; 2026 Peninah Elizabeth Akoth | All Rights Reserved</p>

    </footer>
</body>

</html>
